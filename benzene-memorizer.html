<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ベンゼン暗記帳</title>
<style>
:root{--bg:#fbfaf8;--card:#fff;--tx:#33384a;--sub:#7b8194;--ac:#6f9bd1;--acl:#e8f0fa;--ok:#5fae8a;--okl:#e4f4ec;--ng:#d98080;--ngl:#fbeaea;--ln:#e7e5e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:78px}
header{padding:14px 16px 4px;padding-top:max(14px,env(safe-area-inset-top));font-weight:700;font-size:18px}header small{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px}
main{max-width:640px;margin:0 auto;padding:8px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--sub)}nav button b{display:block;font-size:19px;font-weight:400}nav .on{color:var(--ac);font-weight:700}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:11px 14px;font-size:15px;color:var(--tx)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.g{background:var(--okl);border-color:#bfe3d0}button.r{background:var(--ngl);border-color:#efc7c7}
.fx{flex:1}.bar{height:9px;background:#eceae5;border-radius:6px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st div{background:var(--acl);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--sub)}.st b{display:block;font-size:20px;color:var(--tx)}
.big{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:700;cursor:pointer;flex-direction:column;gap:6px}
img{max-width:100%;max-height:230px;display:block}.sm img{max-height:84px}.sm svg{height:84px}svg{max-height:230px}
.ch{display:grid;gap:8px;margin-top:10px}.ch.im{grid-template-columns:1fr 1fr}.ch button{text-align:left;padding:12px;min-height:50px;border:1px solid var(--ln);border-radius:12px;background:#fff;font-size:16px;color:var(--tx)}.ch.im button{display:flex;align-items:center;justify-content:center;min-height:120px}.ch.im img{max-height:100px}.ch.im svg{height:100px;width:auto}
.ch .ok{background:var(--okl);border-color:var(--ok)}.ch .ng{background:var(--ngl);border-color:var(--ng)}
.ex{background:var(--acl);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}.mut{color:var(--sub);font-size:13px}
.rx{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}.rx:first-child{border:0}.rx .l{color:var(--ac);font-size:12px;flex:1;text-align:center}
.hid{background:var(--acl);border-radius:8px;padding:2px 10px;color:var(--ac);cursor:pointer}a.n{color:var(--ac);text-decoration:underline;cursor:pointer}
select{padding:10px;border-radius:10px;border:1px solid var(--ln);background:#fff;font-size:15px}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;background:var(--ngl);color:var(--ng)}
</style></head><body>

if(useF){const r=f[Math.random()*f.length|0];bad=x=>R.some(y=>y[0]===r[0]&&y[1]===x);body=`<div class=sm>${pic(I[ix[r[0]]])}</div><div>「<b>${r[0]}</b>」を<br><span style="color:var(--ac)">${r[2]}</span><br>の反応で作ると、できる物質は？</div>`}
else{const r=b[Math.random()*b.length|0];bad=x=>R.some(y=>y[1]===r[1]&&y[0]===x);body=`<div class=sm>${pic(I[ix[r[1]]])}</div><div>「<b>${r[1]}</b>」は <span style="color:var(--ac)">${r[2]}</span> で作られる。<br>反応前の物質は？</div>`}
ch=shuf([ans,...shuf(names.filter(x=>x!==ans&&!bad(x))).slice(0,3)])}
if(t=='i2n'){body=`<div>${pic(i)}</div><div class=mut>この構造式の物質名は？</div>`;ch=shuf([n,...shuf(names.filter(x=>x!==n)).slice(0,3)])}
else if(t=='n2i'){isImg=1;body=`<div style="font-size:20px"><b>${n}</b></div><div class=mut>構造式はどれ？</div>`;ch=shuf([n,...shuf(names.filter(x=>x!==n)).slice(0,3)])}
Q.cur={n,ans,ch,isImg,t};
V().innerHTML=`<div class=row><span class=mut>正解 ${Q.ok} / ${Q.all}</span><span style="flex:1"></span><button class=b onclick="go('quiz')">終了</button></div><div class="c" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center">${body}</div>
<div class="ch ${isImg?'im':''}">${ch.map((c,k)=>`<button onclick="ansQ(${k})">${isImg?pic(I[ix[c]]):c}</button>`).join('')}</div><div id=fb></div>`}
function ansQ(k){const c=Q.cur;if(c.done)return;c.done=1;const ok=c.ch[k]===c.ans;Q.all++;if(ok)Q.ok++;rec(c.ans,ok);
const bs=document.querySelectorAll('.ch button');bs.forEach((b,j)=>{if(c.ch[j]===c.ans)b.classList.add('ok');else if(j===k)b.classList.add('ng')});
document.getElementById('fb').innerHTML=`<div class=ex><b>${ok?'⭕ 正解！':'❌ ざんねん'}</b>　正解: ${c.ans}<br>${expl(c.ans)}</div><button class="b p" style="width:100%;margin-top:10px" onclick="nextQ()">次の問題</button>`}
/* review */
function rev(){const w=names.filter(n=>st(n).n&&(weak(n)||st(n).miss)).sort((a,b)=>st(b).w-st(a).w),m=names.filter(n=>st(n).miss);
V().innerHTML=`<div class=c><b>間違い復習</b><div class=mut style="margin:4px 0 10px">間違えた問題は自動登録され、もう一度正解すると外れます。（現在 ${m.length} 問）</div><button class="b p" ${m.length?'':'disabled'} onclick="S.q.scope='miss';S.q.type='mix';Q={ok:0,all:0,last:null};nextQ()">間違えた問題だけテスト</button></div>
<div class=c><b>苦手な物質</b>${w.length?w.map(n=>`<div class=rx><a class=n onclick="go('path');focusOn('${n}')">${n}</a><span class=l></span>${st(n).miss?'<span class=tag>要復習</span> ':''}<span class=mut>✕${st(n).w} ◯${st(n).c}</span></div>`).join(''):'<div class=mut style="margin-top:6px">まだ苦手な物質はありません。テストで間違えるとここに並びます。</div>'}</div>`}
/* paths */
let fo='ベンゼン',hide=1,rev1={};
function focusOn(n){fo=n;path()}
function path(){const i=I[ix[fo]];const rows=(L,k)=>L.map(r=>`<div class=rx><a class=n onclick="focusOn('${r[0]}')">${r[0]}</a><span class=l>→ ${r[2]} →</span>${k?`<a class=n onclick="focusOn('${r[1]}')">${r[1]}</a>`:''}</div>`).join('');
V().innerHTML=`<div class=c><b>反応経路</b> <span class=mut>物質を選ぶと前後のつながりを表示</span><div class=row style="margin-top:8px"><select onchange="focusOn(this.value)">${names.map(n=>`<option ${n==fo?'selected':''}>${n}</option>`).join('')}</select></div></div>
<div class="c" style="text-align:center"><div style="display:flex;justify-content:center">${pic(i)}</div><b>${fo}</b></div>
<div class=c><b>これを作る反応</b>${inc(fo).length?inc(fo).map(r=>`<div class=rx><a class=n onclick="focusOn('${r[0]}')">${r[0]}</a><span class=l>→ ${r[2]} →</span><b>${r[1]}</b></div>`).join(''):'<div class=mut>図にはありません（出発物質）</div>'}</div>
<div class=c><b>つぎの反応</b>${out(fo).length?out(fo).map(r=>`<div class=rx><b>${r[0]}</b><span class=l>→ ${r[2]} →</span><a class=n onclick="focusOn('${r[1]}')">${r[1]}</a></div>`).join(''):'<div class=mut>図には続きがありません（最終生成物）</div>'}</div>
<div class=c><b>全反応で練習</b><div class=mut style="margin:4px 0">生成物を伏せています。タップで表示。</div><div class=row style="margin-bottom:6px"><button class=b onclick="hide=!hide;rev1={};path()">${hide?'伏せ字をやめる':'伏せ字にする'}</button></div>
${R.map((r,k)=>`<div class=rx><span>${r[0]}</span><span class=l>→ ${r[2]} →</span>${hide&&!rev1[k]?`<span class=hid onclick="rev1[${k}]=1;path()">？</span>`:`<span>${r[1]}</span>`}</div>`).join('')}</div>
<div class=c><b>反応式（PDF記載）</b><div class=mut style="margin-top:4px">Ⅱ ジアゾ化：アニリン＋2HCl＋NaNO₂ → 塩化ベンゼンジアゾニウム＋2H₂O＋NaCl<br>Ⅲ 加水分解：塩化ベンゼンジアゾニウム＋H₂O → フェノール＋N₂＋HCl</div></div>
<div class=c><b>判読が不確かな点</b><div class=mut style="margin-top:4px">・クメンヒドロペルオキシド→フェノールの矢印は、条件（H₂SO₄）が図中でアセトンへの矢印と共有されており、どちらの条件かは図からは断定できません。<br>・アニリン塩酸塩→塩化ベンゼンジアゾニウムは点線で、条件の記載がありません。<br>・「酸化」とだけ記載された矢印は、酸化剤が図に書かれていません。<br>・ピクリン酸の別名（2,4,6-トリニトロフェノール）は図の注記どおりです。</div></div>`}
go('home');
</script></body></html>
